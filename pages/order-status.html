<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校園外送｜訂單狀態</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">校園外送</a>
      <nav aria-label="主要導覽"><a href="cart.html">購物車</a><a href="profile.html">會員中心</a><a href="../index.html">首頁</a></nav>
    </header>
    <main class="container">
      <section class="page-heading"><p class="eyebrow">外送進度</p><h1>訂單狀態</h1><p class="muted">使用模擬資料呈現目前的配送進度。</p></section>
      <section class="card">
        <h2>目前進度</h2>

        <div class="order-progress" aria-label="訂單進度">
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" data-progress-fill></div>
          </div>

          <ul class="progress-steps" role="list">
            <li class="step" data-step="0">
              <div class="step-icon">1</div>
              <div class="step-label">店家接單</div>
            </li>
            <li class="step" data-step="1">
              <div class="step-icon">2</div>
              <div class="step-label">餐點製作中</div>
            </li>
            <li class="step" data-step="2">
              <div class="step-icon">3</div>
              <div class="step-label">外送途中</div>
            </li>
            <li class="step" data-step="3">
              <div class="step-icon">4</div>
              <div class="step-label">完成</div>
            </li>
          </ul>
        </div>

        <p class="status-message" aria-live="polite" data-order-status-text>狀態：等待店家接單</p>

        <div class="controls" aria-hidden="false">
          <button class="button" id="prev-step">上一步</button>
          <button class="button" id="next-step">下一步</button>
          <button class="button" id="simulate">模擬自動進度</button>
        </div>
      </section>
    </main>
    <footer>校園外送小組協作練習</footer><script src="app.js"></script>
  </body>
</html>
